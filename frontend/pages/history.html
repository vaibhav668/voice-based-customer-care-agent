<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportAI — Conversation History</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/design-system.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<!-- Top Navigation Bar -->
<div class="page-topbar">
    <div class="page-title-wrap">
        <div class="page-icon" style="background: var(--accent-teal-subtle); color: var(--accent-teal); border-color: rgba(20,184,166,0.3);">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <div>
            <h1 data-i18n="history_title">Conversation History</h1>
        </div>
    </div>
    <div class="page-topbar-right">
        <div id="lang-selector-container"></div>
        <button class="nav-back-btn" onclick="location.href='../dashboard.html'" data-i18n="nav_dashboard">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </button>
    </div>
</div>

<!-- Two-Panel Layout -->
<div class="history-body">

    <!-- Left Panel: Conversation List -->
    <div class="list-panel">

        <div class="panel-search">
            <div class="ds-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                    type="text"
                    id="history-search"
                    placeholder="Search conversations..."
                    data-i18n-placeholder="search_history_placeholder">
            </div>
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-channel="" data-i18n="all_channels">All</button>
            <button class="tab-btn" data-channel="CHAT" data-i18n="chat_channel">Chat</button>
            <button class="tab-btn" data-channel="VOICE" data-i18n="voice_channel">Voice</button>
        </div>

        <div class="conv-list" id="conv-list">
            <div class="empty-state">
                <p>Loading history...</p>
            </div>
        </div>

    </div>

    <!-- Right Panel: Transcript Detail -->
    <div class="detail-panel">

        <div class="detail-header" id="detail-header" style="display: none;">
            <h2 id="detail-session-id">Session ID</h2>
            <p id="detail-meta-text">Channel &amp; Intent</p>
        </div>

        <div class="messages-container" id="messages-container">
            <div class="empty-state">
                <i class="fa-regular fa-comments"></i>
                <p data-i18n="select_conversation_prompt">Select a conversation from the left to view the transcript.</p>
            </div>
        </div>

    </div>

</div>

<script type="module" src="../js/history.js?v=1.0.1"></script>

</body>
</html>
