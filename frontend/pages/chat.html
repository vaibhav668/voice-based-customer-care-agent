<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportAI — AI Chat Support</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/design-system.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<!-- Top Navigation Bar -->
<div class="page-topbar">
    <div class="page-title-wrap">
        <div class="page-icon"><i class="fa-solid fa-robot"></i></div>
        <h1 data-i18n="chat_title">AI Chat Support</h1>
    </div>
    <div class="page-topbar-right">
        <div id="lang-selector-container"></div>
        <button class="nav-back-btn" onclick="location.href='../dashboard.html'" data-i18n="nav_dashboard">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </button>
    </div>
</div>

<!-- Chat Shell -->
<div class="chat-shell">

    <div id="messages"></div>

    <div class="chat-input-row">
        <input
            id="message"
            type="text"
            placeholder="Ask something..."
            data-i18n-placeholder="chat_placeholder"
            autocomplete="off">
        <button id="send" data-i18n="send_btn">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

</div>

<script type="module" src="../js/chat.js?v=1.0.1"></script>

</body>
</html>
