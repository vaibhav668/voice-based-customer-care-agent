<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportAI — Voice Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/design-system.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<!-- Top Navigation Bar -->
<div class="page-topbar">
    <div class="page-title-wrap">
        <div class="page-icon" style="background: var(--accent-amber-subtle); color: var(--accent-amber); border-color: rgba(245,158,11,0.3);">
            <i class="fa-solid fa-microphone-lines"></i>
        </div>
        <h1 data-i18n="voice_title">Voice Assistant</h1>
    </div>
    <div class="page-topbar-right">
        <div id="lang-selector-container"></div>
        <button class="nav-back-btn" onclick="location.href='../dashboard.html'" data-i18n="nav_dashboard">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </button>
    </div>
</div>

<!-- Voice Shell -->
<div class="voice-shell">

    <!-- Conversation Display -->
    <div id="conversation">
        <p class="voice-placeholder" data-i18n="voice_subtitle">Click the microphone or upload an audio file to begin.</p>
    </div>

    <!-- Record Button -->
    <div class="record-area">
        <button id="record" data-i18n="voice_start_record">
            <i class="fa-solid fa-microphone"></i>
            Start Recording
        </button>
    </div>

    <!-- Upload Section -->
    <div class="upload-section">
        <div class="upload-label" data-i18n="voice_upload_heading">Upload Recording</div>
        <div class="upload-row">
            <input type="file" id="audio-file" accept="audio/*">
            <button id="upload-btn" data-i18n="voice_upload_btn">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload
            </button>
        </div>
    </div>

    <!-- Language Keypad -->
    <div id="voice-keypad" style="display: none;">
        <div class="section-card">
            <div class="section-label">Quick Actions</div>
            <div class="keypad-grid"></div>
        </div>
    </div>

</div>

<script type="module" src="../js/voice.js?v=1.0.2"></script>

</body>
</html>
