<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportAI — Sign In</title>
    <meta name="description" content="Sign in to SupportAI — your AI-powered customer support platform.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div id="lang-selector-container"></div>

<div class="auth-container">
    <div class="auth-card">

        <div class="logo-mark">🤖</div>

        <h1 data-i18n="app_title">SupportAI</h1>
        <p data-i18n="login_subtitle">Sign in to continue</p>

        <form id="login-form">

            <div class="input-group" style="display: flex; gap: 8px;">
                <div style="position: relative; flex: 1; display: flex; align-items: center;">
                    <i class="fa-solid fa-phone"></i>
                    <input
                        id="phone"
                        type="tel"
                        placeholder="Phone Number"
                        data-i18n-placeholder="phone_placeholder"
                        style="padding-left: 40px; width: 100%;"
                        required>
                </div>
                <button id="send-otp-btn" type="button">Send OTP</button>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input
                    id="otp"
                    type="text"
                    placeholder="Enter OTP"
                    data-i18n-placeholder="otp_placeholder"
                    required>
            </div>

            <button type="submit" class="login-btn" data-i18n="login_btn">
                Sign In
            </button>

        </form>

        <p class="bottom-text">
            <span data-i18n="no_account">Don't have an account?</span>
            <a href="register.html" data-i18n="register_link"> Register</a>
        </p>

        <div id="message"></div>

    </div>
</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
