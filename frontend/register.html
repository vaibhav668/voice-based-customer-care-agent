<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportAI — Create Account</title>
    <meta name="description" content="Create your SupportAI account to access AI-powered customer support.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div id="lang-selector-container"></div>

<div class="auth-container">
    <div class="auth-card">

        <div class="logo-mark">🤖</div>

        <h1 data-i18n="register_title">Create Account</h1>
        <p class="auth-sub">Join SupportAI to get started</p>

        <form id="register-form">

            <div class="field">
                <i class="fa-solid fa-user"></i>
                <input
                    id="full_name"
                    placeholder="Full Name"
                    data-i18n-placeholder="fullname_placeholder"
                    required>
            </div>

            <div class="field" style="gap: 8px;">
                <div style="position: relative; flex: 1; display: flex; align-items: center;">
                    <i class="fa-solid fa-phone"></i>
                    <input
                        id="phone"
                        placeholder="Phone Number"
                        data-i18n-placeholder="phone_placeholder"
                        style="padding-left: 40px; width: 100%;"
                        required>
                </div>
                <button id="send-otp-btn" type="button">Send OTP</button>
            </div>

            <div class="field">
                <i class="fa-solid fa-key"></i>
                <input
                    id="otp"
                    placeholder="Enter OTP"
                    data-i18n-placeholder="otp_placeholder"
                    required>
            </div>

            <button type="submit" data-i18n="register_btn">Create Account</button>

        </form>

        <p>
            <span data-i18n="has_account">Already have an account?</span>
            <a href="index.html" data-i18n="login_link"> Sign In</a>
        </p>

        <div id="message"></div>

    </div>
</div>

<script type="module" src="js/register.js"></script>

</body>
</html>
